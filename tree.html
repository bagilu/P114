<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>樹木檔案｜P114 我們的樹</title><link rel="stylesheet" href="assets/css/app.css?v=0.002"></head><body><header class="topbar"><div class="shell topbar-inner"><a class="brand" href="index.html"><span class="brand-mark">樹</span><span>P114｜我們的樹<small>MyTreeMyRoot</small></span></a><a class="btn" href="login.html">登入</a></div></header><main><section class="shell tree-hero"><div id="tree-media" class="tree-hero-media"></div><div class="tree-title"><div id="tree-badges"></div><div id="tree-id" class="eyebrow">TREE</div><h1 id="tree-name">載入中…</h1><div id="tree-latin" class="latin"></div><p id="tree-location" class="meta"></p><div class="hero-actions"><button id="visit-btn" class="btn btn-primary">我找到它了</button><button id="guardian-btn" class="btn">設為我的守護樹</button></div><div class="stat-row"><div class="stat"><strong id="guardian-count">—</strong><span class="meta">守護者</span></div></div></div></section><section class="shell section"><div class="section-head"><div><h2>你找到的是這棵嗎？</h2><p>GPS 只告訴你附近候選樹；請用環境照片確認。</p></div></div><div id="confirm-photos" class="photo-strip"></div></section><section class="shell section"><div class="grid grid-2"><article class="card"><h2>物種基本資料</h2><div id="species-info" class="meta">載入中…</div></article><article class="card"><h2>這一棵樹</h2><div id="individual-info" class="meta">載入中…</div></article></div></section><section class="shell section"><div class="section-head"><div><h2>一樹一月一影</h2><p>One Tree, One Month, One Photo</p></div></div><div id="month-state" class="state">正在讀取月度照片…</div><div id="month-grid" class="month-grid" hidden></div></section><section class="shell section"><div class="grid grid-2"><article class="card"><h2>樹語</h2><div id="tree-language" class="meta">尚無資料。</div></article><article class="card"><h2>樹的故事</h2><div id="story-state" class="state">正在讀取故事…</div><div id="story-list"></div></article></div></section><section class="shell section"><div class="section-head"><div><h2>留下你的連結</h2><p>登入後可投稿本月照片、樹語與故事。</p></div></div><div class="grid grid-3"><article class="card"><h3>本月一影</h3><form id="photo-form"><div class="form-row"><label>照片</label><input id="photo-file" type="file" accept="image/jpeg,image/png,image/webp" required></div><div class="form-row"><label>一句說明</label><input id="photo-caption" maxlength="160"></div><label style="display:flex;gap:8px;align-items:flex-start;font-weight:500;margin-bottom:12px"><input id="photo-consent" type="checkbox" style="width:auto;margin-top:4px"><span>若照片中有人物，我已確認其同意公開投稿。</span></label><button class="btn btn-primary">送出本月照片</button></form><div id="photo-submit-state" class="state" style="margin-top:12px" hidden></div></article><article class="card"><h3>我的一句樹語</h3><form id="language-form"><div id="language-options" class="form-row"><div class="meta">載入候選詞…</div></div><div class="form-row"><label>一句樹語</label><textarea id="language-text" rows="4" maxlength="300"></textarea></div><button class="btn btn-primary">儲存樹語</button></form><div id="language-submit-state" class="state" style="margin-top:12px" hidden></div></article><article class="card"><h3>寫一段樹的故事</h3><form id="story-form"><div class="form-row"><label>標題</label><input id="story-title" maxlength="150" required></div><div class="form-row"><label>內容</label><textarea id="story-content" rows="6" required></textarea></div><div class="form-row"><label>公開身份</label><select id="story-identity"><option value="nickname">暱稱</option><option value="anonymous">匿名</option></select></div><button class="btn btn-primary">送出故事</button></form><div id="story-submit-state" class="state" style="margin-top:12px" hidden></div></article></div></section><div id="tree-state" class="shell state" hidden></div></main><div id="footer"></div><script src="config.js?v=0.002"></script><script type="module" src="assets/js/pages/tree.js?v=0.002"></script></body></html>
