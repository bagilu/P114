<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scientific Record｜P114 管理後台</title><link rel="stylesheet" href="../assets/css/app.css?v=0.019"></head><body><header class="topbar"><div class="shell topbar-inner"><a class="brand" href="../index.html"><span class="brand-mark">樹</span><span>P114 管理後台<small>Scientific Record</small></span></a><div class="top-actions"><span class="auth-status" data-auth-status>檢查登入狀態…</span><a class="btn" href="../index.html">回主畫面</a><a class="btn" href="../login.html" data-auth-action>登入</a></div></div></header><div class="admin-shell"><aside class="admin-nav"><a href="index.html">Dashboard</a><a href="trees.html">Tree Management</a><a href="profile-audit.html">Tree Profile Audit</a><a href="founding.html">Founding Trees</a><a href="cleanup.html">Data Cleanup</a><a href="photos.html">Photo Review</a><a href="stories.html">Story Review</a><a href="language.html">Tree Language</a><a href="coverage.html">Monthly Coverage</a><a href="phenology.html" style="background:var(--surface-soft);font-weight:800">Scientific Record</a></aside><main class="admin-main"><div class="section-head"><div><h1>Scientific Tree Record</h1><p>建立個體樹的物候紀錄：新葉、開花、結果、落葉與觀察備註。</p></div></div><div class="grid grid-2"><article class="card"><h2>新增 / 編輯物候紀錄</h2><form id="form"><input id="id" type="hidden"><div class="form-row"><label>Tree</label><select id="tree" required></select></div><div class="form-row"><label>Observation Date</label><input id="date" type="date" required></div><div class="grid grid-2"><div class="form-row"><label>新葉</label><select id="new-leaf"><option value="">—</option><option value="none">none｜無</option><option value="low">low｜少量</option><option value="medium">medium｜中等</option><option value="high">high｜大量</option><option value="unknown">unknown｜未知</option></select></div><div class="form-row"><label>開花</label><select id="flowering"><option value="">—</option><option value="none">none｜無</option><option value="low">low｜少量</option><option value="medium">medium｜中等</option><option value="high">high｜大量</option><option value="unknown">unknown｜未知</option></select></div><div class="form-row"><label>結果</label><select id="fruiting"><option value="">—</option><option value="none">none｜無</option><option value="low">low｜少量</option><option value="medium">medium｜中等</option><option value="high">high｜大量</option><option value="unknown">unknown｜未知</option></select></div><div class="form-row"><label>落葉</label><select id="leaf-fall"><option value="">—</option><option value="none">none｜無</option><option value="low">low｜少量</option><option value="medium">medium｜中等</option><option value="high">high｜大量</option><option value="unknown">unknown｜未知</option></select></div></div><div class="form-row"><label>Note</label><textarea id="note" rows="5"></textarea></div><button class="btn btn-primary" type="submit">儲存 Scientific Record</button> <button id="reset" class="btn" type="button">清除</button></form><div id="form-state" class="state" hidden style="margin-top:12px"></div></article><article class="card"><div class="section-head"><div><h2>年度紀錄</h2><p>選擇樹與年度查看。</p></div></div><div class="grid grid-2"><div class="form-row"><label>Tree</label><select id="filter-tree"></select></div><div class="form-row"><label>Year</label><input id="year" type="number" min="2020" max="2100"></div></div><button id="load" class="btn">讀取紀錄</button><div id="state" class="state" style="margin-top:12px">請選擇 Tree。</div><div id="list" class="timeline-list" hidden></div></article></div></main></div><script src="../config.js?v=0.019"></script><script type="module" src="../assets/js/auth-ui-admin.js?v=0.019"></script><script type="module" src="../assets/js/admin/phenology.js?v=0.019"></script></body></html>
