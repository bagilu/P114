<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登入｜P114 我們的樹</title>
<link rel="stylesheet" href="assets/css/app.css?v=0.016">
</head>
<body>
<header class="topbar">
  <div class="shell topbar-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark">樹</span>
      <span>P114｜我們的樹<small>MyTreeMyRoot</small></span>
    </a>
    <span class="auth-status" id="login-header-status">檢查登入狀態…</span>
  </div>
</header>

<main class="shell section" style="max-width:620px">
  <div class="section-head">
    <div>
      <h1>登入 P114</h1>
      <p>使用與 P130 相同的 Shared Auth 帳號。P114 會保存自己的登入 session。</p>
    </div>
  </div>

  <div id="existing-session" class="session-banner" hidden>
    <strong id="existing-session-title">你已登入 P114。</strong>
    <div id="existing-session-email" class="meta" style="margin-top:4px"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
      <a class="btn btn-primary" href="index.html">回到 P114</a>
      <button id="login-page-logout" class="btn" type="button">登出</button>
    </div>
  </div>

  <div class="card" id="login-card">
    <form id="login-form">
      <div class="form-row">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="email" inputmode="email">
      </div>

      <div class="form-row">
        <label for="password">密碼</label>
        <div class="password-wrap">
          <input id="password" type="password" required autocomplete="current-password">
          <button id="password-toggle" class="password-toggle" type="button"
                  aria-controls="password" aria-pressed="false">顯示密碼</button>
        </div>
      </div>

      <button id="login-submit" class="btn btn-primary" type="submit">登入</button>
    </form>

    <div id="login-state" class="state" style="margin-top:16px" hidden aria-live="polite"></div>

    <div class="login-links">
      <a id="register-link" class="btn" href="#">還沒有帳號？前往 P130 註冊</a>
      <a id="forgot-link" class="btn" href="#">忘記密碼？前往 P130</a>
    </div>
  </div>

  <p class="meta" style="margin-top:14px">
    說明：P130 與 P114 共用同一組帳號資料，但各站保存自己的登入 session；
    因此「在 P130 已登入」不等於瀏覽器已自動登入 P114。
  </p>
</main>

<div id="footer"></div>
<script src="config.js?v=0.016"></script>
<script type="module" src="assets/js/pages/login.js?v=0.016"></script>
</body>
</html>
